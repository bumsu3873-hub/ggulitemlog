<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7f9; --card:#ffffff; --ink:#2b2226; --sub:#8a7a80;
    --pink:#f06d93; --pink-soft:#ffe4ec; --line:#f3dde4; --hl:#fff0b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 48px}
  header{padding:28px 0 18px;text-align:center}
  .logo{display:inline-block;background:var(--pink-soft);color:var(--pink);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:10px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .lead{color:var(--sub);font-size:14px;margin-top:6px}
  .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
  .box{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--pink);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:0 6px 18px rgba(240,109,147,.15)}
  .box span{font-weight:800;color:var(--pink);font-size:18px}
  .box input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:20px;font-weight:700;padding:10px 0;background:transparent;color:var(--ink)}
  .box button{border:0;background:var(--pink);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:12px 16px;border-radius:12px;cursor:pointer}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;text-align:center}
  .notice{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 16px;line-height:1.5}
  .found{display:none;margin-bottom:18px}
  .found.on{display:block}
  .found .item{border:2px solid var(--pink);background:#fffafb}
  .found-label{font-size:13px;font-weight:700;color:var(--pink);margin-bottom:8px}
  .empty{display:none;text-align:center;color:var(--sub);font-size:14px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:18px}
  .empty.on{display:block}
  .list-title{font-size:14px;font-weight:700;color:var(--sub);margin:6px 2px 10px}
  .item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .num{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--pink-soft);color:var(--pink);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
  .body{flex:1;min-width:0}
  .name{font-size:14px;font-weight:500;line-height:1.45;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .buy{display:inline-block;margin-top:8px;background:var(--pink);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px}
  .item.flash{background:var(--hl)}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:24px}
  footer a{color:var(--pink)}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>

  </header>

  <div class="search">
    <form class="box" id="form">
      <span>No.</span>
      <input id="q" type="text" inputmode="numeric" placeholder="번호 입력 (예: 52)" autocomplete="off">
      <button type="submit">찾기</button>
    </form>
  </div>

  <p class="notice">이 페이지의 링크는 네이버 쇼핑 커넥트 링크로, 구매 시 일정 수수료를 받을 수 있습니다.</p>

  <div class="found" id="found">
    <p class="found-label">찾으시는 제품이에요</p>
    <div id="foundItem"></div>
  </div>
  <p class="empty" id="empty">해당 번호의 제품이 없어요. 번호를 다시 확인해 주세요.</p>

  <p class="list-title">전체 꿀템 (최신순)</p>
  <div id="list"></div>

  <footer>
    더 자세한 후기는 <a href="https://blog.naver.com/haring7743" target="_blank" rel="noopener">세꿀사 블로그</a>에서 볼 수 있어요
    <p style="margin-top:10px"><a href="https://www.youtube.com/@Proposeallitem" target="_blank" rel="noopener"><span style="display:inline-block;background:#ff0000;color:#fff;border-radius:4px;padding:0 5px;font-size:10px">▶</span> YouTube 세꿀사 채널</a> · <a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">서비스 약관</a></p>

</div>

  ["클리오 킬커버 메쉬 글로우 에센셜 쿠션 기획세트", "https://naver.me/FTdxAnmk"],
  ["율무 나이아신아마이드 순율 크림 50ml", "https://naver.me/54KiiZF9"],
  ["AHC 프리미엄 앰플 인 아이크림 35ml 10개", "https://naver.me/FSvYYygQ"]
];

const card = (n, [name, url]) => `
  <div class="item" id="item-${n}">
    <div class="num">${n}</div>
    <div class="body">
      <p class="name">${name}</p>
      <a class="buy" href="${url}" target="_blank" rel="noopener">구매하러 가기 →</a>
    </div>
  </div>`;

const list = document.getElementById('list');
list.innerHTML = items.map((it, i) => card(i + 1, it)).reverse().join('');

const found = document.getElementById('found');
const foundItem = document.getElementById('foundItem');
const empty = document.getElementById('empty');
const q = document.getElementById('q');

function lookup(v) {
  const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
  found.classList.remove('on'); empty.classList.remove('on');
  if (!n) return;
  if (n >= 1 && n <= items.length) {
    foundItem.innerHTML = card(n, items[n - 1]);
    found.classList.add('on');
  } else {
    empty.classList.add('on');
  }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault(); lookup(q.value); q.blur();
});
q.addEventListener('input', () => lookup(q.value));

// 주소 끝에 #52 를 붙이면 52번이 바로 표시됩니다.
if (location.hash) { q.value = location.hash.slice(1); lookup(q.value); }

// 방문자 분석: 어떤 번호의 구매 버튼을 눌렀는지 기록합니다.
document.addEventListener('click', e => {
  const a = e.target.closest('a.buy');
  if (!a) return;
  const n = a.closest('.item').id.replace('item-', '');
  window.va('event', { name: '구매 클릭', data: { 번호: n, 제품: items[n - 1][0] } });
});
</script>
</body>
</html>
